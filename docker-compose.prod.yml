name: bookmarks-archive-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    volumes:
      # Bind mount to a fixed host path so backups have a stable, predictable target.
      # The image runs as non-root (uid:gid 999:999), so the host directory must be owned by it:
      #   mkdir -p /srv/bookmarks/data && chown -R 999:999 /srv/bookmarks/data
      # Override the host side with BOOKMARKS_DATA_DIR if you keep the database elsewhere.
      - ${BOOKMARKS_DATA_DIR:-/srv/bookmarks/data}:/data
    environment:
      DATABASE_URL: sqlite:////data/bookmarks.db
      # LLM_MODEL selects the enrichment provider (default: gemini/gemini-3.5-flash); only the
      # matching *_API_KEY needs to be set. The backend validates this at startup and refuses to
      # boot if the configured model's key is missing.
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      TOGETHERAI_API_KEY: ${TOGETHERAI_API_KEY:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Leave VITE_API_URL unset to let the frontend derive the backend URL from its own
      # hostname at runtime (see frontend/src/api.ts); only set it to override that, e.g. for a
      # reverse-proxied or multi-host deployment.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "80:80"
    restart: unless-stopped
